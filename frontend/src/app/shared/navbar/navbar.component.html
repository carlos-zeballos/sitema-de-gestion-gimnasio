<nav class="navbar glass animate-fade-in">
  <div class="navbar-container">
    <div class="nav-brand">
      <img src="assets/logogym.jpg" alt="Logo" class="nav-logo-img" />
      <span class="brand-text">GIMNASIO GD MADRID</span>
    </div>

    <div class="nav-links">
      <a routerLink="/registro-asistencia" routerLinkActive="active" class="nav-link">Asistencia</a>

      @if (currentUser()?.rol === 'admin') {
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">Dashboard</a>
      }

      <a routerLink="/clientes" routerLinkActive="active" class="nav-link">Socios</a>

      @if (currentUser()?.rol === 'admin') {
        <a routerLink="/usuarios" routerLinkActive="active" class="nav-link">Usuarios</a>
        <a routerLink="/reportes" routerLinkActive="active" class="nav-link">Reportes</a>
        <a routerLink="/configuracion" routerLinkActive="active" class="nav-link">Configuracion</a>
      }
    </div>

    @if (currentUser(); as user) {
      <div class="nav-user-panel">
        <div class="user-avatar">
          {{ user.nombre.charAt(0).toUpperCase() }}
        </div>
        <div class="user-meta">
          <span class="user-name">{{ user.nombre }}</span>
          <span class="user-role badge" [class.badge-admin]="user.rol === 'admin'">
            {{ user.nombre_rol || user.rol }}
          </span>
        </div>
        <button class="btn btn-logout" (click)="logout()" title="Cerrar sesion">
          Salir
        </button>
      </div>
    }
  </div>
</nav>
